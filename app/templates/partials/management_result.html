{% if rows %}
<div class="monitor-table-wrap resource-detail-table-wrap">
  <table class="monitor-table">
    <thead><tr>{% for column in columns %}<th>{{ column }}</th>{% endfor %}</tr></thead>
    <tbody>{% for row in rows %}<tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>{% endfor %}</tbody>
  </table>
</div>
{% elif preview %}
<pre class="monitor-fallback-text">{{ preview }}</pre>
{% else %}
<p class="monitor-empty">No data returned.</p>
{% endif %}
