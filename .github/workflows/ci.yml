name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -r requirements-dev.txt
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Validate publishable repository contents
        run: python scripts/check_publication.py
      - name: Compile Python sources
        run: python -m compileall -q app scripts
      - name: Static correctness checks
        run: python -m ruff check app tests scripts
      - name: Unit and route tests
        run: python -m unittest discover -s tests -q
      - name: Install browser regression dependencies
        run: python -m pip install -e ".[browser]" && python -m playwright install chromium
      - name: Browser action regressions
        env:
          EVSUI_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -p "test_*browser*.py" -v
      - name: Browser parameter regressions
        env:
          EVSUI_BROWSER_TESTS: "1"
        run: python -m unittest tests.test_frontend_parameters -v
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-action-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Build distributable wheel
        run: python -m build --wheel
      - name: Verify wheel excludes local runtime secrets
        run: python scripts/verify_wheel.py
