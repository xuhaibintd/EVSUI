[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teradataevsui"
version = "0.7.0"
description = "FastAPI and HTMX interface for Teradata Vector Store workflows"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "argon2-cffi>=25.1.0,<26",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.13.5,<3",
  "pypdf>=6.17.0,<7",
  "python-multipart>=0.0.32,<0.1",
  "starlette>=0.52.1,<0.53",
  "teradatagenai==20.0.0.9",
  "teradataml>=20.0.0.11,<20.1",
  "unstructured-client==0.46.2",
  "uvicorn>=0.52.4,<0.53",
]

[project.optional-dependencies]
browser = ["playwright>=1.62,<1.63"]

[dependency-groups]
dev = [
  "ruff>=0.16.6,<0.17",
]

[tool.uv]
required-version = "==0.12.10"
no-build = true
python-downloads = "never"
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
teradataevsui-db = "app.db.__main__:main"
teradataevsui-ops = "app.ops.__main__:main"
# Compatibility aliases for existing automation.
evsui-db = "app.db.__main__:main"
evsui-ops = "app.ops.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "config/*.example.json",
  "config/bookrag_retrieval_policy.json",
  "config/bookrag_section_rules.json",
  "static/**/*",
  "templates/**/*.html",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".git",
  ".venv",
  "data",
  "pem_runtime",
  "uploads",
]

[tool.ruff.lint]
# Start with correctness checks. Broader style rules will be enabled one
# feature package at a time as the legacy modules are split.
select = ["E9", "F63", "F7", "F82"]
